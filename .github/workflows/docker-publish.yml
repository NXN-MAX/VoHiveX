name: Build VoHiveX Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-only UPX on the CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
      - name: Prepare and verify pinned build inputs
        run: python3 app/prepare-build.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vohivex
          platforms: linux/amd64
          push: false
          tags: vohivex:2.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
