name: vohivex
services:
  vohive:
    image: ghcr.io/nxn-max/vohivex:2.1.6
    pull_policy: always
    container_name: VoHiveX
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    # NET_ADMIN lets the modem core configure a connected cellular interface.
    # Its route uses metric 5000 and DNS is left unchanged, so the NAS LAN
    # route remains preferred. NET_RAW binds Network Debug sockets to it.
    cap_add: [SYS_MODULE, SETPCAP, DAC_OVERRIDE, NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/config/config.yaml
      # Optional: set an explicit ALSA capture device such as hw:1,0.
      VOHIVEX_CALL_AUDIO_DEVICE: ${VOHIVEX_CALL_AUDIO_DEVICE:-}
    device_cgroup_rules:
      - c 188:* rw
      - c 180:* rw
      - c 116:* rw
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - type: bind
        source: /lib/modules
        target: /lib/modules
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /sys
        target: /host-sys
        bind: {create_host_path: false}
      - ./driver-state:/state
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - /dev:/dev
      - /sys:/sys:ro
    healthcheck:
      test: [CMD-SHELL, '/bin/sh /opt/vohivex/driver.sh container-health && wget -q --spider http://127.0.0.1:7575/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
